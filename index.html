<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Invitación</title>
<meta name="description" content="Cuando alguien te importa, haces cualquier cosa para hacerla sentir especial ✨" />
<meta property="og:title" content="Invitación" />
<meta property="og:description" content="Cuando alguien te importa, haces cualquier cosa para hacerla sentir especial ✨" />
<meta property="og:type" content="website" />
<style>
  :root {
    --bg1: #ede0ff;
    --bg2: #d6bcff;
    --card: rgba(255, 255, 255, 0.65);
    --text: #4a2a6a;
    --accent: #9b5cff;
    --accent2: #c08bff;
    --shadow: rgba(155, 92, 255, 0.35);
  }

  html[data-theme="dark"] {
    --bg1: #180f2e;
    --bg2: #2a1650;
    --card: rgba(40, 25, 70, 0.6);
    --text: #e6d5ff;
    --accent: #b06bff;
    --accent2: #8a5cff;
    --shadow: rgba(160, 90, 255, 0.45);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    background-size: 200% 200%;
    animation: gradientMove 8s ease infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
    transition: color 0.4s ease;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Mariposas flotando de fondo */
  .floaties {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .floaties span {
    position: absolute;
    bottom: -40px;
    opacity: 0.75;
    animation: floatUp linear infinite;
    line-height: 0;
  }
  .floaties svg { display: block; }
  .mini-wing { animation: miniFlapL 0.4s ease-in-out infinite; }
  .mini-wing2 { animation: miniFlapR 0.4s ease-in-out infinite; }
  @keyframes miniFlapL {
    0%, 100% { transform: scaleX(1); }
    50% { transform: scaleX(0.35); }
  }
  @keyframes miniFlapR {
    0%, 100% { transform: scaleX(1); }
    50% { transform: scaleX(0.35); }
  }
  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.75; }
    50% { transform: translateY(-55vh) translateX(24px) rotate(15deg); }
    100% { transform: translateY(-115vh) translateX(-20px) rotate(-10deg); opacity: 0; }
  }

  .card {
    position: relative;
    z-index: 1;
    background: var(--card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 28px;
    padding: 32px 24px 36px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 12px 40px var(--shadow);
    animation: popIn 0.7s cubic-bezier(.2,.8,.3,1.4) both;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* Escena 3D de la mariposa real (SVG) */
  .scene {
    width: 170px;
    height: 150px;
    margin: 0 auto 14px;
    perspective: 700px;
  }
  .butterfly {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: bobFly 3.5s ease-in-out infinite;
  }
  /* aleteo suave arriba-abajo, como volando en el aire */
  @keyframes bobFly {
    0%, 100% { transform: translateY(0) rotateZ(-2deg); }
    50% { transform: translateY(-12px) rotateZ(2deg); }
  }
  .butterfly svg { width: 100%; height: 100%; overflow: visible; }

  /* Las alas se abren y cierran en 3D (aleteo real) */
  .wing {
    transform-box: fill-box;
    transform-style: preserve-3d;
    filter: drop-shadow(0 4px 8px var(--shadow));
  }
  .wing-left {
    transform-origin: right center;
    animation: flapL 0.45s ease-in-out infinite;
  }
  .wing-right {
    transform-origin: left center;
    animation: flapR 0.45s ease-in-out infinite;
  }
  @keyframes flapL {
    0%, 100% { transform: rotateY(0deg); }
    50% { transform: rotateY(72deg); }
  }
  @keyframes flapR {
    0%, 100% { transform: rotateY(0deg); }
    50% { transform: rotateY(-72deg); }
  }
  .antenna { transform-box: fill-box; transform-origin: bottom center; animation: bobFly 3.5s ease-in-out infinite; }

  .reminder {
    display: inline-block;
    margin: 0 auto 10px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 999px;
    box-shadow: 0 6px 16px var(--shadow);
    animation: reminderPulse 2s ease-in-out infinite;
  }
  @keyframes reminderPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  h1 {
    font-size: 26px;
    margin: 8px 0 6px;
    line-height: 1.3;
  }
  p.sub {
    margin: 0 0 24px;
    font-size: 16px;
    opacity: 0.85;
  }

  .buttons {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    position: relative;
    flex-direction: column;
    align-items: stretch;
  }
  button {
    border: none;
    border-radius: 999px;
    padding: 14px 26px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }
  .yes {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 8px 20px var(--shadow);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .yes:active { transform: scale(0.94); }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .no {
    background: rgba(255,255,255,0.5);
    color: var(--text);
    position: relative;
    transition: transform 0.12s ease;
  }
  .no:active { transform: scale(0.96); }

  /* Burbuja de copies: siempre visible dentro de la tarjeta, nunca se pierde */
  .no-bubble {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 12px);
    transform: translateX(-50%) translateY(8px) scale(0.9);
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 10px 16px;
    border-radius: 16px;
    box-shadow: 0 8px 20px var(--shadow);
    white-space: nowrap;
    max-width: 88vw;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 6;
  }
  .no-bubble::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-top-color: var(--accent2);
  }
  .no-bubble.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }

  /* Botón modo oscuro */
  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 5;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--card);
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 12px var(--shadow);
    font-size: 22px;
    padding: 0;
    animation: none;
  }

  .final {
    display: none;
    z-index: 1;
    position: relative;
    text-align: center;
    animation: popIn 0.6s ease both;
    width: 100%;
    max-width: 400px;
  }
  .final-title {
    opacity: 0;
    animation: fadeUp 0.6s ease 0.1s both;
  }

  /* Escenario del gatito */
  .stage {
    position: relative;
    width: 100%;
    height: 150px;
    margin: 6px 0 4px;
    overflow: hidden;
  }
  .cat {
    position: absolute;
    bottom: 6px;
    left: -70px;
    width: 130px;
    /* camina de izq al centro */
    animation: walkIn 3s cubic-bezier(.4,0,.5,1) 0.4s forwards;
  }
  .cat svg { width: 100%; height: auto; display: block; overflow: visible; }
  .cat svg * { transform-box: fill-box; }

  /* desplazamiento del gato hacia el centro */
  @keyframes walkIn {
    0%   { left: -70px; }
    100% { left: calc(50% - 65px); }
  }

  /* Mientras camina, el SVG entero rebota suave (efecto de paso) */
  .cat .body,
  .cat .head { transform-origin: center bottom; }
  .cat svg { animation: bodyBob 0.5s ease-in-out infinite; }
  @keyframes bodyBob {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  /* ---- Patas caminando: se mecen alternadas desde la cadera ---- */
  .walk-legs .leg { transform-origin: top center; }
  .legF1, .legB2 { animation: stepA 0.5s ease-in-out infinite; }
  .legF2, .legB1 { animation: stepB 0.5s ease-in-out infinite; }
  @keyframes stepA {
    0%,100% { transform: rotate(12deg); }
    50% { transform: rotate(-12deg); }
  }
  @keyframes stepB {
    0%,100% { transform: rotate(-12deg); }
    50% { transform: rotate(12deg); }
  }

  /* El estado sentado está oculto al inicio */
  .sit-legs { opacity: 0; }

  /* ---- Cola: ondea desde su base (junto al cuerpo) ---- */
  .tail {
    transform-origin: 118px 112px;
    animation: wag 1.6s ease-in-out infinite;
  }
  @keyframes wag {
    0%,100% { transform: rotate(-5deg); }
    50% { transform: rotate(8deg); }
  }

  /* Orejas y parpadeo (sutiles) */
  .ear-l { transform-origin: bottom right; }
  .ear-r { transform-origin: bottom left; }
  .ear { animation: earTwitch 3.2s ease-in-out infinite; }
  @keyframes earTwitch {
    0%,90%,100% { transform: rotate(0deg); }
    95% { transform: rotate(6deg); }
  }
  .eye { transform-origin: center; animation: blink 3.4s ease-in-out infinite; }
  @keyframes blink {
    0%,93%,100% { transform: scaleY(1); }
    96% { transform: scaleY(0.1); }
  }

  /* ============ ESTADO SENTADO ============ */
  /* deja de rebotar y de mecer patas; el cuerpo se asienta un poco */
  .cat.sitting svg { animation: none; }
  .cat.sitting .walk-legs .leg { animation: none; }
  /* transición suave al cambiar de patas de caminar a sentado */
  .walk-legs, .sit-legs { transition: opacity 0.35s ease; }
  .cat.sitting .walk-legs { opacity: 0; }
  .cat.sitting .sit-legs { opacity: 1; }
  /* el cuerpo y cabeza bajan levemente al sentarse (asentarse) */
  .cat .body, .cat .head, .cat .walk-legs, .cat .sit-legs {
    transition: transform 0.4s ease;
  }
  .cat.sitting .body { transform: translateY(4px) scaleY(1.04); }
  .cat.sitting .head { transform: translateY(4px); }
  /* la cola se relaja un poco al sentarse */
  .cat.sitting .tail { animation: wagSit 2.2s ease-in-out infinite; }
  @keyframes wagSit {
    0%,100% { transform: rotate(-2deg); }
    50% { transform: rotate(6deg); }
  }

  .final-msg {
    opacity: 0;
    animation: fadeUp 0.7s ease both;
    animation-play-state: paused;
    font-size: 20px;
    font-weight: 700;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ====== Sorpresa (aparece después del mensaje) ====== */
  .surprise {
    margin-top: 18px;
    opacity: 0;
    transform: translateY(14px) scale(0.9);
    transition: opacity 0.6s ease, transform 0.6s cubic-bezier(.2,.8,.3,1.4);
  }
  .surprise.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .gift {
    position: relative;
    width: 76px;
    height: 74px;
    margin: 0 auto 10px;
    animation: giftBounce 1.8s ease-in-out infinite;
  }
  @keyframes giftBounce {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-6px) rotate(2deg); }
  }

  .gift-box {
    position: absolute;
    bottom: 0;
    left: 8px;
    width: 60px;
    height: 46px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 8px 18px var(--shadow);
  }
  .gift-lid {
    position: absolute;
    top: 8px;
    left: 2px;
    width: 72px;
    height: 20px;
    border-radius: 8px;
    background: linear-gradient(135deg, #b57bff, #8a5cff);
    box-shadow: 0 4px 10px var(--shadow);
  }
  /* moño / cinta vertical */
  .gift-ribbon {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 66px;
    background: #ffd9f2;
    border-radius: 4px;
    opacity: 0.95;
  }
  .gift-ribbon::before {
    content: "";
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 16px;
    background: #ffd9f2;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    box-shadow: -12px 0 0 -2px #ffd9f2, 12px 0 0 -2px #ffd9f2;
  }

  .gift-spark {
    position: absolute;
    font-size: 16px;
    opacity: 0;
    animation: sparkle 1.8s ease-in-out infinite;
  }
  .gift-spark.s1 { top: -6px; left: -6px; animation-delay: 0s; }
  .gift-spark.s2 { top: 0; right: -8px; animation-delay: 0.6s; }
  .gift-spark.s3 { bottom: 2px; left: -2px; animation-delay: 1.1s; }
  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0.6); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  .surprise-text {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    opacity: 0.9;
  }

  /* ====== Overlay gracioso al intentar salir / darle atrás ====== */
  .oops {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(30, 15, 55, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .oops.show { display: flex; animation: fadeUp 0.35s ease both; }
  .oops-card {
    background: var(--card);
    border-radius: 24px;
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    box-shadow: 0 16px 44px var(--shadow);
    animation: popIn 0.5s cubic-bezier(.2,.8,.3,1.4) both;
  }
  .oops-emoji {
    font-size: 56px;
    animation: giftBounce 1.6s ease-in-out infinite;
  }
  .oops-text {
    font-size: 18px;
    font-weight: 700;
    margin: 12px 0 20px;
    line-height: 1.35;
  }
  .oops-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 8px 20px var(--shadow);
  }
  .oops-btn:active { transform: scale(0.95); }
</style>
</head>
<body>
  <div class="floaties" id="floaties"></div>

  <button class="theme-toggle" id="themeBtn" aria-label="Cambiar tema">🌙</button>

  <div class="card" id="card">
    <div class="scene">
      <div class="butterfly">
        <svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="wingGrad" cx="35%" cy="35%" r="75%">
              <stop offset="0%" stop-color="#e9d4ff"/>
              <stop offset="45%" stop-color="#b57bff"/>
              <stop offset="100%" stop-color="#7a3fd6"/>
            </radialGradient>
            <radialGradient id="wingGrad2" cx="35%" cy="65%" r="75%">
              <stop offset="0%" stop-color="#dcc0ff"/>
              <stop offset="50%" stop-color="#a55cff"/>
              <stop offset="100%" stop-color="#6a2fc0"/>
            </radialGradient>
          </defs>

          <!-- Antenas -->
          <g class="antenna">
            <path d="M100 78 C92 55, 80 44, 72 38" stroke="#4a2a6a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M100 78 C108 55, 120 44, 128 38" stroke="#4a2a6a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <circle cx="71" cy="37" r="4" fill="#4a2a6a"/>
            <circle cx="129" cy="37" r="4" fill="#4a2a6a"/>
          </g>

          <!-- Ala izquierda -->
          <g class="wing wing-left">
            <!-- ala superior -->
            <path d="M100 88 C60 40, 12 42, 20 82 C24 104, 62 100, 100 96 Z" fill="url(#wingGrad)" stroke="#5a2a8a" stroke-width="1.5"/>
            <!-- ala inferior -->
            <path d="M100 96 C70 108, 30 116, 34 142 C38 162, 78 140, 100 108 Z" fill="url(#wingGrad2)" stroke="#5a2a8a" stroke-width="1.5"/>
            <!-- detalles -->
            <circle cx="46" cy="72" r="7" fill="#f3e6ff" opacity="0.85"/>
            <circle cx="58" cy="130" r="5" fill="#f3e6ff" opacity="0.8"/>
          </g>

          <!-- Ala derecha -->
          <g class="wing wing-right">
            <path d="M100 88 C140 40, 188 42, 180 82 C176 104, 138 100, 100 96 Z" fill="url(#wingGrad)" stroke="#5a2a8a" stroke-width="1.5"/>
            <path d="M100 96 C130 108, 170 116, 166 142 C162 162, 122 140, 100 108 Z" fill="url(#wingGrad2)" stroke="#5a2a8a" stroke-width="1.5"/>
            <circle cx="154" cy="72" r="7" fill="#f3e6ff" opacity="0.85"/>
            <circle cx="142" cy="130" r="5" fill="#f3e6ff" opacity="0.8"/>
          </g>

          <!-- Cuerpo -->
          <ellipse cx="100" cy="98" rx="6" ry="26" fill="#3a2255"/>
          <circle cx="100" cy="74" r="7" fill="#3a2255"/>
        </svg>
      </div>
    </div>
    <p class="reminder">📌 Para que no se te olvide</p>
    <h1>Nos vemos? 😊</h1>
    <p class="sub">No lo pienses tanto... que te espero 😌</p>
    <div class="buttons">
      <button class="yes" id="yesBtn">Va, acepto 🤝</button>
      <button class="no" id="noBtn">Déjame pensarlo</button>
      <span class="no-bubble" id="noBubble"></span>
    </div>
  </div>

  <div class="final" id="final">
    <h1 class="final-title">No hay vuelta atrás 😉</h1>

    <div class="stage">
      <!-- Gatito que camina y se sienta -->
      <div class="cat" id="cat">
        <svg viewBox="0 0 170 150" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="catGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#c79bff"/>
              <stop offset="100%" stop-color="#9b5cff"/>
            </linearGradient>
          </defs>

          <!-- COLA: nace del cuerpo (der) y ondea desde su base -->
          <path class="tail" d="M118 112 C150 112, 154 82, 140 70"
                stroke="url(#catGrad)" stroke-width="11" fill="none" stroke-linecap="round"/>

          <!-- ===== ESTADO CAMINANDO (4 patas) ===== -->
          <g class="walk-legs">
            <rect class="leg legB1" x="55" y="106" width="9" height="24" rx="4" fill="#7d43d6"/>
            <rect class="leg legB2" x="96" y="106" width="9" height="24" rx="4" fill="#7d43d6"/>
            <rect class="leg legF1" x="66" y="108" width="9" height="24" rx="4" fill="#8a4fe0"/>
            <rect class="leg legF2" x="85" y="108" width="9" height="24" rx="4" fill="#8a4fe0"/>
          </g>

          <!-- ===== ESTADO SENTADO (patas delanteras juntas) ===== -->
          <g class="sit-legs">
            <rect x="70" y="112" width="11" height="20" rx="5" fill="#8a4fe0"/>
            <rect x="84" y="112" width="11" height="20" rx="5" fill="#8a4fe0"/>
            <ellipse cx="76" cy="132" rx="8" ry="4" fill="#7d43d6"/>
            <ellipse cx="90" cy="132" rx="8" ry="4" fill="#7d43d6"/>
          </g>

          <!-- CUERPO -->
          <ellipse class="body" cx="82" cy="98" rx="40" ry="30" fill="url(#catGrad)"/>

          <!-- CABEZA -->
          <g class="head">
            <path class="ear ear-l" d="M54 60 L50 36 L72 52 Z" fill="#9b5cff"/>
            <path class="ear ear-r" d="M110 60 L114 36 L92 52 Z" fill="#9b5cff"/>
            <path d="M56 56 L54 43 L66 52 Z" fill="#ffb6e6"/>
            <path d="M108 56 L110 43 L98 52 Z" fill="#ffb6e6"/>
            <circle cx="82" cy="70" r="30" fill="url(#catGrad)"/>
            <circle class="eye" cx="71" cy="68" r="4.5" fill="#2a1540"/>
            <circle class="eye" cx="93" cy="68" r="4.5" fill="#2a1540"/>
            <path d="M82 76 l-4 4 h8 z" fill="#ff8fd0"/>
            <path d="M82 82 q-6 6 -12 2 M82 82 q6 6 12 2" stroke="#2a1540" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M60 74 h-18 M60 80 h-16 M104 74 h18 M104 80 h16" stroke="#e9d4ff" stroke-width="1.6" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
    </div>

    <p class="sub final-msg" id="finalMsg">Estaré esperando 💜</p>

    <div class="surprise" id="surprise">
      <div class="gift">
        <div class="gift-lid"></div>
        <div class="gift-box"></div>
        <div class="gift-ribbon"></div>
        <span class="gift-spark s1">✨</span>
        <span class="gift-spark s2">✨</span>
        <span class="gift-spark s3">✨</span>
      </div>
      <p class="surprise-text">Hay sorpresa 🎁 pero los detalles... solo por chat 😏</p>
    </div>
  </div>

  <!-- Mensaje gracioso si intenta salir / darle atrás -->
  <div class="oops" id="oops">
    <div class="oops-card">
      <div class="oops-emoji" id="oopsEmoji">😳</div>
      <p class="oops-text" id="oopsText">Ey... ¿pa dónde crees que vas? 👀</p>
      <button class="oops-btn" id="oopsBtn">Ups, me quedo 😅</button>
    </div>
  </div>

<script>
  // ----- Modo oscuro -----
  const themeBtn = document.getElementById('themeBtn');
  const html = document.documentElement;
  const saved = localStorage.getItem('theme');
  // Modo oscuro por defecto; si ella ya eligió un tema, se respeta.
  html.setAttribute('data-theme', saved || 'dark');
  updateIcon();

  themeBtn.addEventListener('click', () => {
    const isDark = html.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    updateIcon();
  });
  function updateIcon() {
    const isDark = html.getAttribute('data-theme') === 'dark';
    themeBtn.textContent = isDark ? '☀️' : '🌙';
  }

  // ----- Mariposas flotando (SVG mini, alas que aletean) -----
  const floaties = document.getElementById('floaties');
  function miniButterflySVG(size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 100 90">' +
      '<g class="mini-wing" style="transform-origin:50px 50px">' +
      '<path d="M50 45 C25 15, 2 20, 8 45 C12 62, 35 55, 50 50 Z" fill="#b57bff" opacity="0.85"/>' +
      '<path d="M50 50 C30 60, 10 68, 14 82 C18 92, 42 72, 50 55 Z" fill="#8a5cff" opacity="0.85"/>' +
      '</g>' +
      '<g class="mini-wing2" style="transform-origin:50px 50px">' +
      '<path d="M50 45 C75 15, 98 20, 92 45 C88 62, 65 55, 50 50 Z" fill="#b57bff" opacity="0.85"/>' +
      '<path d="M50 50 C70 60, 90 68, 86 82 C82 92, 58 72, 50 55 Z" fill="#8a5cff" opacity="0.85"/>' +
      '</g>' +
      '<ellipse cx="50" cy="50" rx="3" ry="14" fill="#3a2255"/>' +
      '</svg>';
  }
  function spawnButterfly(minDur, maxDur, minSize) {
    const s = document.createElement('span');
    const size = (minSize || 22) + Math.random() * 22;
    s.innerHTML = miniButterflySVG(size);
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (minDur + Math.random() * (maxDur - minDur)) + 's';
    s.style.animationDelay = (Math.random() * 8) + 's';
    floaties.appendChild(s);
  }
  for (let i = 0; i < 14; i++) spawnButterfly(8, 15, 20);

  // ----- Botón travieso: muestra copies en una burbuja (siempre visible) -----
  const noBtn = document.getElementById('noBtn');
  const noBubble = document.getElementById('noBubble');
  const messages = [
    'Jajaja no 😏',
    'Esa opción no existe 🙈',
    '¿Segura segura? 🥺',
    'Botón dañado, intenta el otro 🛠️',
    'Mi corazón dice que sí 💜',
    'Piénsalo... ya lo pensaste, di que sí',
    'Última oportunidad de decir que sí 😌',
    'Ok, ese botón no hace nada 😂'
  ];
  let msgIndex = 0;
  let hideTimer;

  function teaseNo() {
    noBubble.textContent = messages[msgIndex];
    msgIndex = (msgIndex + 1) % messages.length;
    noBubble.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => noBubble.classList.remove('show'), 2200);
  }

  noBtn.addEventListener('mouseenter', teaseNo);
  noBtn.addEventListener('click', function(e){ e.preventDefault(); teaseNo(); });
  noBtn.addEventListener('touchstart', function(e){ e.preventDefault(); teaseNo(); }, {passive:false});

  // ----- Botón "Sí" -----
  document.getElementById('yesBtn').addEventListener('click', () => {
    document.getElementById('card').style.display = 'none';
    noBtn.style.display = 'none';
    document.getElementById('final').style.display = 'block';

    const cat = document.getElementById('cat');
    const msg = document.getElementById('finalMsg');

    // El gato camina (0.4s delay + 3s). Al llegar al centro: se sienta.
    setTimeout(() => {
      cat.classList.add('sitting'); // cambia a postura sentada con transición suave
    }, 3400);
    // El mensaje aparece un momento después de sentarse.
    setTimeout(() => {
      msg.style.animationPlayState = 'running';
      for (let i = 0; i < 16; i++) spawnButterfly(4, 8, 24);
    }, 4000);
    // La sorpresa aparece después del mensaje.
    setTimeout(() => {
      document.getElementById('surprise').classList.add('show');
    }, 5200);
  });

  // ----- Si intenta "darle atrás": mensaje gracioso -----
  const oops = document.getElementById('oops');
  const oopsText = document.getElementById('oopsText');
  const oopsEmoji = document.getElementById('oopsEmoji');
  const oopsBtn = document.getElementById('oopsBtn');
  const oopsMsgs = [
    { e: '👀', t: 'Ey... ¿pa dónde crees que vas?' },
    { e: '🥺', t: 'No huyas, apenas empezábamos' },
    { e: '😏', t: 'El botón de atrás no funciona con el destino' },
    { e: '🙈', t: '¿Nervios? Es normal, quédate' },
    { e: '😅', t: 'Intento de escape detectado... denegado' },
    { e: '💜', t: 'Aquí no hay salida, solo un sí' }
  ];
  let oopsIndex = 0;

  function showOops() {
    const m = oopsMsgs[oopsIndex % oopsMsgs.length];
    oopsIndex++;
    oopsEmoji.textContent = m.e;
    oopsText.textContent = m.t + ' ' + m.e;
    oops.classList.add('show');
  }

  oopsBtn.addEventListener('click', () => oops.classList.remove('show'));
  oops.addEventListener('click', (e) => { if (e.target === oops) oops.classList.remove('show'); });

  // Atrapar el botón "atrás" del navegador
  history.pushState(null, '', location.href);
  window.addEventListener('popstate', () => {
    showOops();
    // volver a empujar el estado para seguir "atrapando" el atrás
    history.pushState(null, '', location.href);
  });

  // Aviso al intentar cerrar/recargar la pestaña
  window.addEventListener('beforeunload', (e) => {
    e.preventDefault();
    e.returnValue = '';
  });
</script>
</body>
</html>
